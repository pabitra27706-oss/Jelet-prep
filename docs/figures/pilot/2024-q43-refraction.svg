<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="t d" width="320" height="300">
  <!--
    RECONSTRUCTED FIGURE — not official WBJEEB artwork.
    Source: JELET-2024, Paper-I (E.T., B.Sc., B.Voc., D.Voc.), booklet 4091010805, page 11, Q43.
    Redrawn from the official booklet on 2026-11-02 as original vector line art.
    No pixel data from the official PDF is stored in this file.

    What this figure carries: medium 1 below the boundary and medium 2 above it, a normal
    (dashed) at the crossing point, alpha-1 measured from the normal to the incident ray
    in medium 1, and alpha-2 measured from the normal to the refracted ray in medium 2.

    What it does NOT claim: scale. The source sketch is schematic. The refracted ray is
    drawn bending away from the normal (alpha_2 > alpha_1) as the source shows; the
    correct option follows from Snell's law and lambda proportional to 1/n, which does not
    depend on the drawn angles. Angles drawn: 40 degrees and 55 degrees.
    See docs/decisions/ADR-0002-figure-reconstruction.md.
  -->
  <title id="t">A light ray crossing the boundary between medium 1 and medium 2, with angles alpha-1 and alpha-2 measured from the normal</title>
  <desc id="d">A horizontal boundary separates medium 1 (below) from medium 2 (above). A dashed vertical
    normal crosses it at the point where the ray crosses. A ray arrives from the lower left in medium 1,
    making an angle alpha-1 with the normal. It crosses the boundary and continues into medium 2, making
    a larger angle alpha-2 with the normal. Arrowheads on both rays point away from the crossing point.</desc>

  <defs>
    <marker id="ray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328" />
    </marker>
  </defs>

  <g fill="none" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round">
    <!-- interface between the two media -->
    <line x1="24" y1="160" x2="296" y2="160" />
    <!-- normal at the point of incidence -->
    <line x1="160" y1="22" x2="160" y2="284" stroke-dasharray="7 5" stroke-width="1.3" />
  </g>

  <g fill="none" stroke="#1f2328" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ray)">
    <!-- incident ray, in medium 1, arriving at the boundary -->
    <line x1="55" y1="284" x2="160" y2="160" />
    <!-- refracted ray, leaving into medium 2 -->
    <line x1="160" y1="160" x2="253" y2="28" />
  </g>

  <g fill="none" stroke="#1f2328" stroke-width="1.5">
    <!-- alpha-1: between the normal and the incident ray, drawn in MEDIUM 1 (below) -->
    <path d="M 160 200 A 40 40 0 0 1 134.3 190.6" />
    <!-- alpha-2: between the normal and the refracted ray, drawn in MEDIUM 2 (above) -->
    <path d="M 160 110 A 50 50 0 0 1 188.8 119.2" />
  </g>

  <g fill="#1f2328" font-family="system-ui, sans-serif" font-size="15">
    <text x="131" y="216" text-anchor="middle">α<tspan font-size="10" dy="4">1</tspan></text>
    <text x="131" y="126" text-anchor="middle">α<tspan font-size="10" dy="4">2</tspan></text>
    <text x="258" y="205">1</text>
    <text x="258" y="68">2</text>
  </g>
</svg>
